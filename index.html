    <!-- JSON-LD: organization + services + site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://the-office-test4.vercel.app/#organization",
          "name": "THE OFFICE",
          "alternateName": "The Office Studio",
          "url": "https://the-office-test4.vercel.app/",
          "logo": "https://the-office-test4.vercel.app/favicon.svg",
          "image": "https://the-office-test4.vercel.app/og-image.png",
          "description": "A four-person studio for authors, publishers, and the people who run literary businesses. Book strategy, book research, custom web design, and automation.",
          "foundingDate": "2021",
          "areaServed": ["US", "PT", "GB", "EU"],
          "knowsLanguage": ["en", "pt"],
          "priceRange": "$$$",
          "email": "theofficetechies@gmail.com",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Studio services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Book Strategy" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Book Research & Analysis" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Design" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Automation" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://the-office-test4.vercel.app/#website",
          "url": "https://the-office-test4.vercel.app/",
          "name": "THE OFFICE",
          "publisher": { "@id": "https://the-office-test4.vercel.app/#organization" },
          "inLanguage": "en"
        }
      ]
    }
    </script>

    <!-- Font preconnect + preloads for the display face used above the fold -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      We only preload Fraunces (the display face) for above-the-fold hero text.
      Body and mono faces load via the stylesheet below with display=swap,
      so body text never blocks first paint.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>THE OFFICE — Book strategy, web, automation, research</title>
  </head>
  <body>
    <!--
      Noscript fallback: this is a client-rendered React app. Without
      JS, the document body is empty. Give visitors (and crawlers
      without JS) a real, in-voice message + a mailto.
    -->
    <noscript>
      <div style="font-family: Georgia, serif; max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; color: #000; background: #fff;">
        <p style="font-size: 11px; letter-spacing: 0.1em; font-family: monospace; text-transform: uppercase; opacity: 0.6; margin: 0 0 0.5rem 0;">THE OFFICE</p>
        <h1 style="font-size: 2.5rem; line-height: 1; margin: 0 0 1.5rem 0; font-weight: 300;">JavaScript is off.</h1>
        <p style="font-size: 1rem; line-height: 1.6; margin: 0 0 1rem 0;">This page is a small client-rendered site. With scripting disabled you are seeing the fallback. The short version of who we are: a four-person studio for book strategy, web design, automation, and book research.</p>
        <p style="font-size: 1rem; line-height: 1.6; margin: 0 0 1rem 0;">The best way to reach us is by email:</p>
        <p style="font-size: 1.1rem; margin: 0;"><a href="mailto:theofficetechies@gmail.com" style="color: #000; border-bottom: 1px solid #000; text-decoration: none;">theofficetechies@gmail.com</a></p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
