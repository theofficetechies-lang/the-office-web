<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="THE OFFICE 360 — a four-person studio for book strategy, book research, web design, and automation. Research, strategy, design and technology on one brief. No subcontractors, no juniors on your project." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://www.the-office360.com/" />

    <!-- Hreflang + RSS (updated by scripts/build-sitemap.mjs for the live origin) -->
    <link rel="alternate" hreflang="en" href="https://www.the-office360.com/" />
    <link rel="alternate" hreflang="pt" href="https://www.the-office360.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.the-office360.com/" />
    <link rel="alternate" type="application/rss+xml" title="THE OFFICE 360 — Notes" href="https://www.the-office360.com/rss.xml" />

    <!-- Favicon set -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THE OFFICE 360" />
    <meta property="og:title" content="THE OFFICE 360 — Book strategy, web design, automation, research" />
    <meta property="og:description" content="A four-person studio for authors, publishers, and the people who run literary businesses. Book strategy, book research, custom web, automation." />
    <meta property="og:url" content="https://www.the-office360.com/" />
    <meta property="og:image" content="https://www.the-office360.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="THE OFFICE 360 — a small studio for book strategy, web, automation, and research." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THE OFFICE 360 — Book strategy, web design, automation, research" />
    <meta name="twitter:description" content="A four-person studio for authors, publishers, and the people who run literary businesses." />
    <meta name="twitter:image" content="https://www.the-office360.com/og-image.png" />
    <meta name="twitter:image:alt" content="THE OFFICE 360 — a small studio for book strategy, web, automation, and research." />

    <!-- JSON-LD: organization + services + site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://www.the-office360.com/#organization",
          "name": "THE OFFICE 360",
          "alternateName": "The Office 360",
          "url": "https://www.the-office360.com/",
          "logo": "https://www.the-office360.com/favicon.svg",
          "image": "https://www.the-office360.com/og-image.png",
          "description": "A four-person studio for authors, publishers, and the people who run literary businesses. Book strategy, book research, custom web design, and automation.",
          "foundingDate": "2021",
          "areaServed": ["US", "PT", "GB", "EU"],
          "knowsLanguage": ["en", "pt"],
          "priceRange": "$$$",
          "email": "theofficetechies@gmail.com",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Studio services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Book Strategy" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Book Research & Analysis" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Design" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Automation" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.the-office360.com/#website",
          "url": "https://www.the-office360.com/",
          "name": "THE OFFICE 360",
          "publisher": { "@id": "https://www.the-office360.com/#organization" },
          "inLanguage": "en"
        }
      ]
    }
    </script>

    <!-- Font preconnect + preloads for the display face used above the fold -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      We only preload Fraunces (the display face) for above-the-fold hero text.
      Body and mono faces load via the stylesheet below with display=swap,
      so body text never blocks first paint.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>THE OFFICE 360 — Book strategy, web, automation, research</title>

    <!--
      Language, resolved before first paint.

      Prerendered markup is English. A visitor who previously chose Portuguese
      would otherwise hydrate English HTML with Portuguese copy, and React would
      discard the server DOM (“hydration failed”) on every page and re-render from
      scratch. Applying the stored choice here — blocking, before the bundle — makes
      the client's first render agree with the document.

      Deliberately tiny and dependency-free: it runs before anything else and must
      never throw. If storage is unavailable it does nothing and English stands.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("the-office:lang") === "pt") {
            document.documentElement.lang = "pt";
          }
        } catch (e) {
          /* storage blocked — leave lang="en" */
        }
      })();
    </script>
  </head>
  <body>
    <!--
      The mount node is filled by scripts/prerender.mjs at build time with real
      server-rendered markup, so this document is already the page. The former
      <noscript> fallback ("JavaScript is off.") was removed: with prerendering
      it was redundant, and it put a second <h1> plus stale "client-rendered
      site" copy into all 97 shipped documents.

      In `vite dev` this node stays empty and src/main.tsx creates the tree; in
      the prerendered build it hydrates instead.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
